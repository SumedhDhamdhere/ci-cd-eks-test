# ================================================================
# CI/CD Pipeline — GitHub Actions
#
# Flow:
#   feature/* branch → PR → tests run
#   merge to develop → build + push to Floci-simulated ECR + deploy to an
#                       ephemeral local Kind cluster (stands in for EKS)
#   merge to main    → same mechanism, gated behind manual approval (see
#                       the `production` GitHub Environment)
#
# This project intentionally never touches real AWS — everything runs
# against Floci. "Prod" here means "the approval-gated path," not "real
# infrastructure." Dev and prod each get their own fresh Floci + Kind
# (GitHub Actions jobs are isolated runners — nothing from one job's
# Floci/registry/cluster persists into another job), so there's no
# single shared artifact to promote between them; the meaningful
# difference is the required-reviewer gate on the `production`
# Environment, not the underlying infrastructure.
#
# Why dev (and prod) deploy to Kind, not Floci's "EKS":
#   Floci's EKS is more real than it first appears — `aws eks create-cluster`
#   actually provisions a working k3s cluster that runs real pods. But two
#   things make it a poor fit for an automated CI job specifically:
#     1. Pulling pushed images into it requires reaching into the cluster's
#        container and hand-editing containerd's registry config (verified
#        by hand — there's no AWS-API-level way to do this), which isn't
#        something a CI script can reliably automate.
#     2. Floci's k3s node uses default flannel/overlay pod networking
#        (10.42.0.0/16), not real VPC-routable pod IPs the way EKS's VPC
#        CNI does — so an ALB target group with target-type=ip can never
#        actually reach a pod (verified: target health always reports
#        Target.FailedHealthChecks).
#   Kind sidesteps both: images load directly into its node via
#   `kind load docker-image` (no registry roundtrip needed) and its
#   networking is CI-friendly out of the box.
#   (scripts/01-06 still exercise the full Floci EKS+ALB path for learning
#   purposes — see scripts/README.md — just not as part of automated CI.)
# ================================================================

name: E-Commerce CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: ap-south-1
  SERVICES: user-service product-service order-service inventory-service payment-service notification-service

jobs:
  # ── JOB 1: TEST ──────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests for all services
        run: |
          for svc in $SERVICES; do
            echo "=== Testing $svc ==="
            cd $svc
            mvn test -q
            cd ..
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'

  # ── DEV PATH: build + push to Floci + deploy to an ephemeral Kind cluster ──
  build-push-deploy-dev:
    name: Build, Push & Deploy to DEV (Floci)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: dev

    # Floci is spun up fresh for this job only (same pattern as the
    # postgres/redis services above) — it does not persist across jobs,
    # and does not depend on any developer's machine being online.
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        options: >-
          -v /var/run/docker.sock:/var/run/docker.sock
          --health-cmd "curl -f http://localhost:4566/_floci/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate image tag
        id: meta
        run: |
          # Tag = git short SHA (e.g. abc1234) — immutable, every commit = unique image
          echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS env for Floci
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Wait for Floci's ECR backing registry
        run: |
          # Floci lazily starts its Docker Registry v2 sidecar (host port 5100)
          # on the first ECR API call — trigger that, then poll until reachable.
          aws ecr get-login-password --endpoint-url http://localhost:4566 > /tmp/ecr-pass
          for i in $(seq 1 30); do
            curl -sf http://localhost:5100/v2/ && break
            echo "waiting for floci ecr registry... ($i/30)"
            sleep 2
          done
          cat /tmp/ecr-pass | docker login --username AWS --password-stdin localhost:5100

      - name: Build all services
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          for svc in $SERVICES; do
            echo "=== Building $svc ==="
            cd $svc && mvn package -DskipTests -q && cd ..
            docker build -t localhost:5100/ecommerce/$svc:$IMAGE_TAG \
                         -t localhost:5100/ecommerce/$svc:latest \
                         $svc/
          done

      - name: Scan images for vulnerabilities (Trivy)
        run: |
          for svc in $SERVICES; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --exit-code 1 --severity CRITICAL \
              --ignore-unfixed localhost:5100/ecommerce/$svc:${{ steps.meta.outputs.version }}
          done

      - name: Push all services to Floci ECR
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          for svc in $SERVICES; do
            docker push localhost:5100/ecommerce/$svc:$IMAGE_TAG
            docker push localhost:5100/ecommerce/$svc:latest
            echo "✅ $svc pushed: $IMAGE_TAG"
          done

      - name: Create local Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ecommerce-dev
          wait: 120s

      - name: Load images into Kind
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          for svc in $SERVICES; do
            kind load docker-image localhost:5100/ecommerce/$svc:$IMAGE_TAG --name ecommerce-dev
          done

      - name: Deploy to DEV namespace
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          sed -i "s|REGISTRY/ecommerce|localhost:5100/ecommerce|g" k8s/services/deployments.yaml
          sed -i "s|IMAGE_TAG|$IMAGE_TAG|g" k8s/services/deployments.yaml
          # Images were loaded directly into Kind's node containerd cache above,
          # so the cluster never needs to actually reach localhost:5100 itself.
          sed -i "/image: localhost:5100/a\\        imagePullPolicy: IfNotPresent" k8s/services/deployments.yaml

          kubectl apply -f k8s/namespace/namespace.yaml
          kubectl apply -f k8s/postgres/postgres.yaml
          kubectl apply -f k8s/redis/redis.yaml
          kubectl apply -f k8s/kafka/kafka.yaml
          kubectl apply -f k8s/kong/kong.yaml
          kubectl apply -f k8s/services/configmap.yaml

          # Secrets injected at deploy time — never stored in source control.
          # Values here are demo credentials matching the ephemeral Kind/Postgres
          # containers provisioned above.  In a real project these would come from
          # a secrets manager (AWS Secrets Manager, Vault, GitHub Secrets, etc.).
          kubectl create secret generic app-secrets -n ecommerce \
            --from-literal=REDIS_PASSWORD=redis_pass \
            --from-literal=JWT_SECRET=myProductionSecretKey123456789012345678901234 \
            --from-literal=AWS_ACCESS_KEY_ID=test \
            --from-literal=AWS_SECRET_ACCESS_KEY=test \
            --from-literal=USER_DB_URL=jdbc:postgresql://postgres-user-0.postgres-user.ecommerce.svc.cluster.local:5432/userdb \
            --from-literal=USER_DB_USER=user_svc \
            --from-literal=USER_DB_PASS=user_pass \
            --from-literal=ORDER_DB_URL=jdbc:postgresql://postgres-order-0.postgres-order.ecommerce.svc.cluster.local:5432/orderdb \
            --from-literal=ORDER_DB_USER=order_svc \
            --from-literal=ORDER_DB_PASS=order_pass \
            --from-literal=PRODUCT_DB_URL=jdbc:postgresql://postgres-product-0.postgres-product.ecommerce.svc.cluster.local:5432/productdb \
            --from-literal=PRODUCT_DB_USER=product_svc \
            --from-literal=PRODUCT_DB_PASS=product_pass \
            --from-literal=INVENTORY_DB_URL=jdbc:postgresql://postgres-inventory-0.postgres-inventory.ecommerce.svc.cluster.local:5432/inventorydb \
            --from-literal=INVENTORY_DB_USER=inventory_svc \
            --from-literal=INVENTORY_DB_PASS=inventory_pass \
            --from-literal=PAYMENT_DB_URL=jdbc:postgresql://postgres-payment-0.postgres-payment.ecommerce.svc.cluster.local:5432/paymentdb \
            --from-literal=PAYMENT_DB_USER=payment_svc \
            --from-literal=PAYMENT_DB_PASS=payment_pass \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/services/deployments.yaml
          # monitoring.yaml intentionally not applied here — Prometheus/Grafana/
          # Loki aren't needed to validate a CI smoke test and add resource
          # overhead the CI runner doesn't have to spare.

          for svc in $SERVICES; do
            kubectl rollout status deployment/$svc -n ecommerce --timeout=300s
            echo "✅ $svc deployed"
          done

      - name: Smoke test via Kong
        run: |
          kubectl port-forward -n ecommerce svc/kong-proxy 8000:80 &
          sleep 5
          curl -f -X POST http://localhost:8000/api/users/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Smoke Test","email":"ci-smoke-test@example.com","password":"password123"}'
          echo "✅ Smoke test passed"

      - name: Pod status (always shown for debugging)
        if: always()
        run: |
          kubectl get pods -n ecommerce
          kubectl get svc -n ecommerce

  # ── PROD PATH: same mechanism as dev (Floci + Kind), gated behind a
  # required-reviewer approval on the `production` GitHub Environment.
  # No real AWS credentials anywhere in this job, by design.
  build-push-deploy-prod:
    name: Build, Push & Deploy to PROD (Floci, approval-gated)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production  # requires manual approval in GitHub

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        options: >-
          -v /var/run/docker.sock:/var/run/docker.sock
          --health-cmd "curl -f http://localhost:4566/_floci/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate image tag
        id: meta
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS env for Floci
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Wait for Floci's ECR backing registry
        run: |
          aws ecr get-login-password --endpoint-url http://localhost:4566 > /tmp/ecr-pass
          for i in $(seq 1 30); do
            curl -sf http://localhost:5100/v2/ && break
            echo "waiting for floci ecr registry... ($i/30)"
            sleep 2
          done
          cat /tmp/ecr-pass | docker login --username AWS --password-stdin localhost:5100

      - name: Build all services
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          for svc in $SERVICES; do
            echo "=== Building $svc ==="
            cd $svc && mvn package -DskipTests -q && cd ..
            docker build -t localhost:5100/ecommerce/$svc:$IMAGE_TAG \
                         -t localhost:5100/ecommerce/$svc:latest \
                         $svc/
          done

      - name: Scan images for vulnerabilities (Trivy)
        run: |
          for svc in $SERVICES; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --exit-code 1 --severity CRITICAL \
              --ignore-unfixed localhost:5100/ecommerce/$svc:${{ steps.meta.outputs.version }}
          done

      - name: Push all services to Floci ECR
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          for svc in $SERVICES; do
            docker push localhost:5100/ecommerce/$svc:$IMAGE_TAG
            docker push localhost:5100/ecommerce/$svc:latest
            echo "✅ $svc pushed: $IMAGE_TAG"
          done

      - name: Create local Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ecommerce-prod
          wait: 120s

      - name: Load images into Kind
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          for svc in $SERVICES; do
            kind load docker-image localhost:5100/ecommerce/$svc:$IMAGE_TAG --name ecommerce-prod
          done

      - name: Deploy to ecommerce namespace
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          sed -i "s|REGISTRY/ecommerce|localhost:5100/ecommerce|g" k8s/services/deployments.yaml
          sed -i "s|IMAGE_TAG|$IMAGE_TAG|g" k8s/services/deployments.yaml
          sed -i "/image: localhost:5100/a\\        imagePullPolicy: IfNotPresent" k8s/services/deployments.yaml

          kubectl apply -f k8s/namespace/namespace.yaml
          kubectl apply -f k8s/postgres/postgres.yaml
          kubectl apply -f k8s/redis/redis.yaml
          kubectl apply -f k8s/kafka/kafka.yaml
          kubectl apply -f k8s/kong/kong.yaml
          kubectl apply -f k8s/services/configmap.yaml

          # Secrets injected at deploy time — never stored in source control.
          # Values here are demo credentials matching the ephemeral Kind/Postgres
          # containers provisioned above.  In a real project these would come from
          # a secrets manager (AWS Secrets Manager, Vault, GitHub Secrets, etc.).
          kubectl create secret generic app-secrets -n ecommerce \
            --from-literal=REDIS_PASSWORD=redis_pass \
            --from-literal=JWT_SECRET=myProductionSecretKey123456789012345678901234 \
            --from-literal=AWS_ACCESS_KEY_ID=test \
            --from-literal=AWS_SECRET_ACCESS_KEY=test \
            --from-literal=USER_DB_URL=jdbc:postgresql://postgres-user-0.postgres-user.ecommerce.svc.cluster.local:5432/userdb \
            --from-literal=USER_DB_USER=user_svc \
            --from-literal=USER_DB_PASS=user_pass \
            --from-literal=ORDER_DB_URL=jdbc:postgresql://postgres-order-0.postgres-order.ecommerce.svc.cluster.local:5432/orderdb \
            --from-literal=ORDER_DB_USER=order_svc \
            --from-literal=ORDER_DB_PASS=order_pass \
            --from-literal=PRODUCT_DB_URL=jdbc:postgresql://postgres-product-0.postgres-product.ecommerce.svc.cluster.local:5432/productdb \
            --from-literal=PRODUCT_DB_USER=product_svc \
            --from-literal=PRODUCT_DB_PASS=product_pass \
            --from-literal=INVENTORY_DB_URL=jdbc:postgresql://postgres-inventory-0.postgres-inventory.ecommerce.svc.cluster.local:5432/inventorydb \
            --from-literal=INVENTORY_DB_USER=inventory_svc \
            --from-literal=INVENTORY_DB_PASS=inventory_pass \
            --from-literal=PAYMENT_DB_URL=jdbc:postgresql://postgres-payment-0.postgres-payment.ecommerce.svc.cluster.local:5432/paymentdb \
            --from-literal=PAYMENT_DB_USER=payment_svc \
            --from-literal=PAYMENT_DB_PASS=payment_pass \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/services/deployments.yaml

          # Rolling update — K8s replaces pods one by one (zero downtime)
          for svc in $SERVICES; do
            kubectl rollout status deployment/$svc -n ecommerce --timeout=300s
            echo "✅ $svc deployed"
          done

      - name: Smoke test via Kong
        run: |
          kubectl port-forward -n ecommerce svc/kong-proxy 8000:80 &
          sleep 5
          curl -f -X POST http://localhost:8000/api/users/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Prod Smoke Test","email":"ci-prod-smoke-test@example.com","password":"password123"}'
          echo "✅ Smoke test passed"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deploy failed — rolling back"
          for svc in $SERVICES; do
            kubectl rollout undo deployment/$svc -n ecommerce || true
          done

      - name: Pod status (always shown for debugging)
        if: always()
        run: |
          kubectl get pods -n ecommerce
          kubectl get svc -n ecommerce
