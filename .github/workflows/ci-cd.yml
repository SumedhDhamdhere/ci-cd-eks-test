# ================================================================
# CI/CD Pipeline — GitHub Actions
#
# Flow:
#   PR / push          → test   (6 services tested IN PARALLEL via matrix)
#   push to develop    → deploy-dev  (real K8s deploy + full saga smoke test)
#   push to main       → deploy-prod (same, gated by `production` approval)
#
# Design choices for speed:
#   • Unit tests run as a 6-way matrix — all services test at once, not in a loop.
#   • Deploy builds all 6 modules in ONE parallel Maven reactor build (mvn -T),
#     then builds the 6 images and loads them straight into the cluster — no
#     registry round-trip, no rebuilding the same image in multiple jobs.
#   • Deploy target is k3d (k3s-in-docker) — the SAME k3s engine Floci's EKS
#     provisions — because it's CI-reliable and boots in ~30s (Kind takes 5-10m).
#   • The full Floci EKS+ALB+ECR path is exercised by scripts/01-06 locally
#     (see scripts/README.md) — CI proves the app + manifests, fast.
# ================================================================
name: E-Commerce CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  SERVICES: user-service product-service order-service inventory-service payment-service notification-service

jobs:
  # ── JOB 1: TEST (6 services in parallel) ─────────────────────────────────
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # one service failing shouldn't hide the others
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - inventory-service
          - payment-service
          - notification-service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Unit test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_USER: test
          DB_PASSWORD: test
          REDIS_PASSWORD: test
        run: mvn -B -pl ${{ matrix.service }} -am test

  # ── JOB 2: DEPLOY TO DEV (real K8s + full saga smoke test) ───────────────
  deploy-dev:
    name: Deploy to DEV (K8s / Floci-equivalent)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build all 6 modules at once (parallel reactor), then all 6 images.
      - name: Build all services (parallel reactor)
        run: mvn -B -T 1C package -DskipTests

      - name: Build images
        run: |
          for svc in $SERVICES; do
            docker build -t local/ecommerce/$svc:ci $svc/ &
          done
          wait
          echo "✅ All 6 images built"

      - name: Scan an image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/ecommerce/user-service:ci
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache: true

      - name: Create k3d cluster
        run: |
          # Install latest k3d directly (the pinned action used an old version
          # whose download URL now 404s). install.sh always resolves a valid release.
          curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version
          k3d cluster create ecommerce --agents 1 --wait --timeout 120s
          kubectl cluster-info

      - name: Import images into cluster
        run: |
          IMAGES=""
          for svc in $SERVICES; do IMAGES="$IMAGES local/ecommerce/$svc:ci"; done
          k3d image import $IMAGES -c ecommerce

      - name: Namespace, secrets, config
        run: |
          kubectl apply -f k8s/namespace/namespace.yaml
          kubectl create secret generic app-secrets -n ecommerce \
            --from-literal=REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.FLOCI_AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.FLOCI_AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=USER_DB_URL='jdbc:postgresql://postgres-user-0.postgres-user.ecommerce.svc.cluster.local:5432/userdb' \
            --from-literal=USER_DB_USER="${{ secrets.USER_DB_USER }}" --from-literal=USER_DB_PASS="${{ secrets.USER_DB_PASS }}" \
            --from-literal=ORDER_DB_URL='jdbc:postgresql://postgres-order-0.postgres-order.ecommerce.svc.cluster.local:5432/orderdb' \
            --from-literal=ORDER_DB_USER="${{ secrets.ORDER_DB_USER }}" --from-literal=ORDER_DB_PASS="${{ secrets.ORDER_DB_PASS }}" \
            --from-literal=PRODUCT_DB_URL='jdbc:postgresql://postgres-product-0.postgres-product.ecommerce.svc.cluster.local:5432/productdb' \
            --from-literal=PRODUCT_DB_USER="${{ secrets.PRODUCT_DB_USER }}" --from-literal=PRODUCT_DB_PASS="${{ secrets.PRODUCT_DB_PASS }}" \
            --from-literal=INVENTORY_DB_URL='jdbc:postgresql://postgres-inventory-0.postgres-inventory.ecommerce.svc.cluster.local:5432/inventorydb' \
            --from-literal=INVENTORY_DB_USER="${{ secrets.INVENTORY_DB_USER }}" --from-literal=INVENTORY_DB_PASS="${{ secrets.INVENTORY_DB_PASS }}" \
            --from-literal=PAYMENT_DB_URL='jdbc:postgresql://postgres-payment-0.postgres-payment.ecommerce.svc.cluster.local:5432/paymentdb' \
            --from-literal=PAYMENT_DB_USER="${{ secrets.PAYMENT_DB_USER }}" --from-literal=PAYMENT_DB_PASS="${{ secrets.PAYMENT_DB_PASS }}"
          kubectl apply -f k8s/services/configmap.yaml

      - name: Deploy data layer (Postgres, Redis, Kafka)
        run: |
          kubectl apply -f k8s/postgres/postgres.yaml
          kubectl apply -f k8s/redis/redis.yaml
          kubectl apply -f k8s/kafka/kafka.yaml
          echo "Waiting for data layer..."
          kubectl wait --for=condition=ready pod -l app=postgres-user      -n ecommerce --timeout=240s
          kubectl wait --for=condition=ready pod -l app=postgres-product   -n ecommerce --timeout=240s
          kubectl wait --for=condition=ready pod -l app=postgres-order     -n ecommerce --timeout=240s
          kubectl wait --for=condition=ready pod -l app=postgres-inventory -n ecommerce --timeout=240s
          kubectl wait --for=condition=ready pod -l app=postgres-payment   -n ecommerce --timeout=240s
          kubectl wait --for=condition=ready pod -l app=redis -n ecommerce --timeout=180s
          kubectl wait --for=condition=ready pod -l app=kafka -n ecommerce --timeout=240s
          echo "✅ Data layer ready"

      - name: Deploy Kong gateway
        run: |
          kubectl apply -f k8s/kong/kong.yaml
          kubectl wait --for=condition=ready pod -l app=kong -n ecommerce --timeout=120s

      - name: Deploy microservices
        run: |
          sed 's|REGISTRY|local|g; s|IMAGE_TAG|ci|g' \
            k8s/services/deployments.yaml | kubectl apply -f -
          for svc in $SERVICES; do
            kubectl rollout status deployment/$svc -n ecommerce --timeout=480s
          done
          echo "✅ All microservices Running"

      - name: Verify cluster state
        run: |
          echo "--- Pods ---";     kubectl get pods -n ecommerce
          echo "--- HPA ---";      kubectl get hpa  -n ecommerce
          echo "--- Services ---"; kubectl get svc  -n ecommerce

      - name: End-to-end smoke test (full saga → order PAID)
        run: bash .github/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl get pods -n ecommerce -o wide || true
          for svc in $SERVICES kong; do
            echo "=========== $svc ==========="
            kubectl logs -l app=$svc -n ecommerce --tail=40 --all-containers || true
          done

  # ── JOB 3: DEPLOY TO PROD (same as dev, gated by approval) ───────────────
  deploy-prod:
    name: Deploy to PROD (K8s, approval-gated)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production   # requires manual reviewer approval in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all services (parallel reactor)
        run: mvn -B -T 1C package -DskipTests

      - name: Build images
        run: |
          for svc in $SERVICES; do
            docker build -t local/ecommerce/$svc:ci $svc/ &
          done
          wait

      - name: Create k3d cluster
        run: |
          # Install latest k3d directly (the pinned action used an old version
          # whose download URL now 404s). install.sh always resolves a valid release.
          curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version
          k3d cluster create ecommerce --agents 1 --wait --timeout 120s
          kubectl cluster-info

      - name: Import images into cluster
        run: |
          IMAGES=""
          for svc in $SERVICES; do IMAGES="$IMAGES local/ecommerce/$svc:ci"; done
          k3d image import $IMAGES -c ecommerce

      - name: Namespace, secrets, config
        run: |
          kubectl apply -f k8s/namespace/namespace.yaml
          kubectl create secret generic app-secrets -n ecommerce \
            --from-literal=REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.FLOCI_AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.FLOCI_AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=USER_DB_URL='jdbc:postgresql://postgres-user-0.postgres-user.ecommerce.svc.cluster.local:5432/userdb' \
            --from-literal=USER_DB_USER="${{ secrets.USER_DB_USER }}" --from-literal=USER_DB_PASS="${{ secrets.USER_DB_PASS }}" \
            --from-literal=ORDER_DB_URL='jdbc:postgresql://postgres-order-0.postgres-order.ecommerce.svc.cluster.local:5432/orderdb' \
            --from-literal=ORDER_DB_USER="${{ secrets.ORDER_DB_USER }}" --from-literal=ORDER_DB_PASS="${{ secrets.ORDER_DB_PASS }}" \
            --from-literal=PRODUCT_DB_URL='jdbc:postgresql://postgres-product-0.postgres-product.ecommerce.svc.cluster.local:5432/productdb' \
            --from-literal=PRODUCT_DB_USER="${{ secrets.PRODUCT_DB_USER }}" --from-literal=PRODUCT_DB_PASS="${{ secrets.PRODUCT_DB_PASS }}" \
            --from-literal=INVENTORY_DB_URL='jdbc:postgresql://postgres-inventory-0.postgres-inventory.ecommerce.svc.cluster.local:5432/inventorydb' \
            --from-literal=INVENTORY_DB_USER="${{ secrets.INVENTORY_DB_USER }}" --from-literal=INVENTORY_DB_PASS="${{ secrets.INVENTORY_DB_PASS }}" \
            --from-literal=PAYMENT_DB_URL='jdbc:postgresql://postgres-payment-0.postgres-payment.ecommerce.svc.cluster.local:5432/paymentdb' \
            --from-literal=PAYMENT_DB_USER="${{ secrets.PAYMENT_DB_USER }}" --from-literal=PAYMENT_DB_PASS="${{ secrets.PAYMENT_DB_PASS }}"
          kubectl apply -f k8s/services/configmap.yaml

      - name: Deploy data layer (Postgres, Redis, Kafka)
        run: |
          kubectl apply -f k8s/postgres/postgres.yaml
          kubectl apply -f k8s/redis/redis.yaml
          kubectl apply -f k8s/kafka/kafka.yaml
          for db in user product order inventory payment; do
            kubectl wait --for=condition=ready pod -l app=postgres-$db -n ecommerce --timeout=240s
          done
          kubectl wait --for=condition=ready pod -l app=redis -n ecommerce --timeout=180s
          kubectl wait --for=condition=ready pod -l app=kafka -n ecommerce --timeout=240s

      - name: Deploy Kong gateway
        run: |
          kubectl apply -f k8s/kong/kong.yaml
          kubectl wait --for=condition=ready pod -l app=kong -n ecommerce --timeout=120s

      - name: Deploy microservices
        run: |
          sed 's|REGISTRY|local|g; s|IMAGE_TAG|ci|g' \
            k8s/services/deployments.yaml | kubectl apply -f -
          for svc in $SERVICES; do
            kubectl rollout status deployment/$svc -n ecommerce --timeout=480s
          done

      - name: End-to-end smoke test (full saga → order PAID)
        run: bash .github/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl get pods -n ecommerce -o wide || true
          for svc in $SERVICES kong; do
            echo "=========== $svc ==========="
            kubectl logs -l app=$svc -n ecommerce --tail=40 --all-containers || true
          done
