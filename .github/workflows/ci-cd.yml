# ================================================================
# CI/CD Pipeline — GitHub Actions
#
# Flow:
#   feature/* branch → PR → tests run
#   merge to develop → build + push to Floci-simulated ECR + deploy to an
#                       ephemeral local Kind cluster (stands in for EKS)
#   merge to main    → same mechanism, gated behind manual approval (see
#                       the `production` GitHub Environment)
#
# This project intentionally never touches real AWS — everything runs
# against Floci. "Prod" here means "the approval-gated path," not "real
# infrastructure." Dev and prod each get their own fresh Floci + Kind
# (GitHub Actions jobs are isolated runners — nothing from one job's
# Floci/registry/cluster persists into another job), so there's no
# single shared artifact to promote between them; the meaningful
# difference is the required-reviewer gate on the `production`
# Environment, not the underlying infrastructure.
#
# Why dev (and prod) deploy to Kind, not Floci's "EKS":
#   Floci's EKS is more real than it first appears — `aws eks create-cluster`
#   actually provisions a working k3s cluster that runs real pods. But two
#   things make it a poor fit for an automated CI job specifically:
#     1. Pulling pushed images into it requires reaching into the cluster's
#        container and hand-editing containerd's registry config (verified
#        by hand — there's no AWS-API-level way to do this), which isn't
#        something a CI script can reliably automate.
#     2. Floci's k3s node uses default flannel/overlay pod networking
#        (10.42.0.0/16), not real VPC-routable pod IPs the way EKS's VPC
#        CNI does — so an ALB target group with target-type=ip can never
#        actually reach a pod (verified: target health always reports
#        Target.FailedHealthChecks).
#   Kind sidesteps both: images load directly into its node via
#   `kind load docker-image` (no registry roundtrip needed) and its
#   networking is CI-friendly out of the box.
#   (scripts/01-06 still exercise the full Floci EKS+ALB path for learning
#   purposes — see scripts/README.md — just not as part of automated CI.)
# ================================================================

name: E-Commerce CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:   # allow manual "Run workflow" for the K8s deploy job

env:
  AWS_REGION: ap-south-1
  SERVICES: user-service product-service order-service inventory-service payment-service notification-service

jobs:
  # ── JOB 1: TEST ──────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests for all services
        run: |
          for svc in $SERVICES; do
            echo "=== Testing $svc ==="
            cd $svc
            mvn test -q
            cd ..
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'

  # ── DEV PATH ─────────────────────────────────────────────────────────────
  # Build → push to Floci-simulated ECR → smoke test via docker-compose.
  #
  # Why docker-compose for the smoke test (not Kind/K8s):
  #   Kind takes 5-10 minutes to spin up and schedule all pods. docker-compose
  #   with pre-built images is ready in ~60 seconds and we've already proven
  #   the app works on it (same tool used for local development). The K8s
  #   manifests are tested locally (minikube / Floci EKS) — CI just needs to
  #   verify the application logic and API endpoints work, which docker-compose
  #   does faster and more reliably.
  build-push-deploy-dev:
    name: Build, Push & Deploy to DEV (Floci)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate image tag
        id: meta
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Start Floci (AWS simulator)
        run: |
          docker compose up -d floci
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/_floci/health && break
            echo "waiting for floci... ($i/30)"; sleep 2
          done

      - name: Configure AWS env for Floci
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Build all services
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          for svc in $SERVICES; do
            echo "=== Building $svc ==="
            cd $svc && mvn package -DskipTests -q && cd ..
            # Tag for Floci ECR (registry demonstration)
            docker build -t localhost:5100/ecommerce/$svc:$IMAGE_TAG \
                         -t localhost:5100/ecommerce/$svc:latest \
                         $svc/
            # Tag for docker-compose (project_service naming convention)
            docker tag localhost:5100/ecommerce/$svc:latest ecommerce-$svc:latest
          done

      - name: Scan images for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          # Scan just one representative image — all 6 share the same
          # eclipse-temurin:21-jre-alpine base, so one scan covers the OS CVEs.
          image-ref: localhost:5100/ecommerce/user-service:${{ steps.meta.outputs.version }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Cache the DB between runs — avoids downloading 100MB every push
          cache: true
          trivy-config: ''

      - name: Push all services to Floci ECR
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          # Floci ECR sidecar starts lazily on first ECR API call
          aws ecr get-login-password --endpoint-url http://localhost:4566 > /tmp/ecr-pass
          for i in $(seq 1 30); do
            curl -sf http://localhost:5100/v2/ && break
            echo "waiting for floci ecr registry... ($i/30)"; sleep 2
          done
          cat /tmp/ecr-pass | docker login --username AWS --password-stdin localhost:5100
          for svc in $SERVICES; do
            docker push localhost:5100/ecommerce/$svc:$IMAGE_TAG
            docker push localhost:5100/ecommerce/$svc:latest
            echo "✅ $svc pushed: $IMAGE_TAG"
          done

      - name: Start full stack (docker-compose, pre-built images)
        run: |
          # --no-build uses the ecommerce-$svc:latest images tagged above.
          # Floci is already up from the earlier step.
          docker compose up -d --no-build
          echo "Waiting for ALL services to be ready behind Kong..."
          for i in $(seq 1 120); do
            P=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/products)
            U=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/api/users/login \
                  -H "Content-Type: application/json" -d '{"email":"x@x.com","password":"x"}')
            O=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/orders/user/1)
            echo "Attempt $i: products=$P users=$U orders=$O"
            if [ "$P" = "200" ] && [ "$U" != "503" ] && [ "$U" != "000" ] && [ "$O" != "503" ] && [ "$O" != "000" ]; then
              echo "All services ready!"; break
            fi
            sleep 5
          done

      - name: Smoke test all endpoints via Kong
        run: |
          echo "-- register --"
          curl -f -X POST http://localhost:8000/api/users/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Test","email":"ci@test.com","password":"password123"}'
          echo "-- products --"
          curl -f http://localhost:8000/api/products
          echo "-- create product --"
          curl -f -X POST http://localhost:8000/api/products \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Widget","price":9.99,"category":"test"}'
          echo "-- orders --"
          curl -f http://localhost:8000/api/orders/user/1
          echo "✅ All endpoints OK"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Kong logs ===" && docker compose logs kong --tail=30
          echo "=== user-service ===" && docker compose logs user-service --tail=20
          echo "=== order-service ===" && docker compose logs order-service --tail=20
          echo "=== product-service ===" && docker compose logs product-service --tail=20

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ── REAL KUBERNETES DEPLOY (Floci-equivalent) ────────────────────────────
  # Deploys the actual k8s/ manifests to a real Kubernetes cluster.
  # We use k3d (k3s-in-docker) — the SAME k3s engine that Floci's EKS
  # provisions — because it's CI-reliable and boots in ~30s. This proves the
  # K8s manifests (StatefulSets, Deployments, HPA, Services) actually apply
  # and the pods reach Ready, which docker-compose cannot verify.
  deploy-k8s:
    name: Deploy to Kubernetes (k3d / Floci-equivalent)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create k3d cluster
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: ecommerce
          args: --agents 1 --wait

      - name: Build + import images into cluster
        run: |
          for svc in $SERVICES; do
            echo "=== Building $svc ==="
            cd $svc && mvn package -DskipTests -q && cd ..
            docker build -t local/ecommerce/$svc:ci $svc/
          done
          # Load all images directly into the k3d cluster (no registry needed)
          for svc in $SERVICES; do
            k3d image import local/ecommerce/$svc:ci -c ecommerce
          done

      - name: Create namespace + secrets + config
        run: |
          kubectl apply -f k8s/namespace/namespace.yaml
          # Secrets injected here (never stored in git) — see configmap.yaml note
          kubectl create secret generic app-secrets -n ecommerce \
            --from-literal=REDIS_PASSWORD=redis_pass \
            --from-literal=JWT_SECRET=ci_jwt_secret_at_least_32_chars_long \
            --from-literal=AWS_ACCESS_KEY_ID=test \
            --from-literal=AWS_SECRET_ACCESS_KEY=test \
            --from-literal=USER_DB_URL='jdbc:postgresql://postgres-user-0.postgres-user.ecommerce.svc.cluster.local:5432/userdb' \
            --from-literal=USER_DB_USER=user_svc --from-literal=USER_DB_PASS=user_pass \
            --from-literal=ORDER_DB_URL='jdbc:postgresql://postgres-order-0.postgres-order.ecommerce.svc.cluster.local:5432/orderdb' \
            --from-literal=ORDER_DB_USER=order_svc --from-literal=ORDER_DB_PASS=order_pass \
            --from-literal=PRODUCT_DB_URL='jdbc:postgresql://postgres-product-0.postgres-product.ecommerce.svc.cluster.local:5432/productdb' \
            --from-literal=PRODUCT_DB_USER=product_svc --from-literal=PRODUCT_DB_PASS=product_pass \
            --from-literal=INVENTORY_DB_URL='jdbc:postgresql://postgres-inventory-0.postgres-inventory.ecommerce.svc.cluster.local:5432/inventorydb' \
            --from-literal=INVENTORY_DB_USER=inventory_svc --from-literal=INVENTORY_DB_PASS=inventory_pass \
            --from-literal=PAYMENT_DB_URL='jdbc:postgresql://postgres-payment-0.postgres-payment.ecommerce.svc.cluster.local:5432/paymentdb' \
            --from-literal=PAYMENT_DB_USER=payment_svc --from-literal=PAYMENT_DB_PASS=payment_pass
          kubectl apply -f k8s/services/configmap.yaml

      - name: Deploy data layer (Postgres, Redis, Kafka)
        run: |
          kubectl apply -f k8s/postgres/postgres.yaml
          kubectl apply -f k8s/redis/redis.yaml
          kubectl apply -f k8s/kafka/kafka.yaml
          kubectl wait --for=condition=ready pod -l app=redis -n ecommerce --timeout=180s
          kubectl wait --for=condition=ready pod -l app=kafka -n ecommerce --timeout=240s
          echo "✅ Data layer ready"

      - name: Deploy Kong gateway
        run: |
          kubectl apply -f k8s/kong/kong.yaml
          kubectl wait --for=condition=ready pod -l app=kong -n ecommerce --timeout=120s

      - name: Deploy microservices
        run: |
          # Substitute image placeholders: REGISTRY→local, IMAGE_TAG→ci
          sed 's|REGISTRY|local|g; s|IMAGE_TAG|ci|g' \
            k8s/services/deployments.yaml | kubectl apply -f -
          for svc in $SERVICES; do
            kubectl rollout status deployment/$svc -n ecommerce --timeout=300s
          done
          echo "✅ All microservices Running"

      - name: Verify deployment
        run: |
          echo "--- Pods ---";     kubectl get pods -n ecommerce
          echo "--- HPA ---";      kubectl get hpa -n ecommerce
          echo "--- Services ---"; kubectl get svc -n ecommerce

      - name: Smoke test via Kong (port-forward)
        run: |
          kubectl port-forward svc/kong-proxy 8000:80 -n ecommerce &
          sleep 8
          curl -f http://localhost:8000/api/products
          curl -f -X POST http://localhost:8000/api/users/register \
            -H "Content-Type: application/json" \
            -d '{"name":"K8s CI","email":"k8s@test.com","password":"password123"}'
          echo "✅ K8s deployment verified"

      - name: Show pod logs on failure
        if: failure()
        run: |
          kubectl get pods -n ecommerce
          for svc in $SERVICES; do
            echo "=== $svc ==="; kubectl logs -l app=$svc -n ecommerce --tail=30 || true
          done

  # ── PROD PATH: same mechanism as dev (Floci + docker-compose), gated behind a
  # required-reviewer approval on the `production` GitHub Environment.
  # No real AWS credentials anywhere in this job, by design.
  build-push-deploy-prod:
    name: Build, Push & Deploy to PROD (Floci, approval-gated)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production  # requires manual approval in GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate image tag
        id: meta
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Start Floci (AWS simulator)
        run: |
          docker compose up -d floci
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/_floci/health && break
            echo "waiting for floci... ($i/30)"; sleep 2
          done

      - name: Configure AWS env for Floci
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Build all services
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          for svc in $SERVICES; do
            echo "=== Building $svc ==="
            cd $svc && mvn package -DskipTests -q && cd ..
            docker build -t localhost:5100/ecommerce/$svc:$IMAGE_TAG \
                         -t localhost:5100/ecommerce/$svc:latest \
                         $svc/
            docker tag localhost:5100/ecommerce/$svc:latest ecommerce-$svc:latest
          done

      - name: Scan images for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5100/ecommerce/user-service:${{ steps.meta.outputs.version }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache: true

      - name: Push all services to Floci ECR
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          aws ecr get-login-password --endpoint-url http://localhost:4566 > /tmp/ecr-pass
          for i in $(seq 1 30); do
            curl -sf http://localhost:5100/v2/ && break
            echo "waiting for floci ecr registry... ($i/30)"; sleep 2
          done
          cat /tmp/ecr-pass | docker login --username AWS --password-stdin localhost:5100
          for svc in $SERVICES; do
            docker push localhost:5100/ecommerce/$svc:$IMAGE_TAG
            docker push localhost:5100/ecommerce/$svc:latest
            echo "✅ $svc pushed: $IMAGE_TAG"
          done

      - name: Start full stack (docker-compose, pre-built images)
        run: |
          docker compose up -d --no-build
          echo "Waiting for ALL services to be ready behind Kong..."
          # Check every service the smoke test will hit.
          # Only proceed when all return 200 — Kong 503 means that specific
          # Spring Boot service is still starting (takes 60-120s each).
          for i in $(seq 1 120); do
            P=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/products)
            U=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/api/users/login \
                  -H "Content-Type: application/json" -d '{"email":"x@x.com","password":"x"}')
            O=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/orders/user/1)
            echo "Attempt $i: products=$P users=$U orders=$O"
            # users returns 401 (wrong creds) = service is UP. orders returns 200 or 404 = UP.
            if [ "$P" = "200" ] && [ "$U" != "503" ] && [ "$U" != "000" ] && [ "$O" != "503" ] && [ "$O" != "000" ]; then
              echo "All services ready!"; break
            fi
            sleep 5
          done

      - name: Smoke test all endpoints via Kong
        run: |
          curl -f -X POST http://localhost:8000/api/users/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Prod Test","email":"ci-prod@test.com","password":"password123"}'
          curl -f http://localhost:8000/api/products
          curl -f -X POST http://localhost:8000/api/products \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Widget","price":9.99,"category":"test"}'
          echo "✅ All endpoints OK"

      - name: Cleanup
        if: always()
        run: docker compose down -v

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Kong logs ===" && docker compose logs kong --tail=30
          echo "=== user-service ===" && docker compose logs user-service --tail=20
          echo "=== order-service ===" && docker compose logs order-service --tail=20
          echo "=== product-service ===" && docker compose logs product-service --tail=20
