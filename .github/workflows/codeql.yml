# ================================================================
# CodeQL — static analysis security scanning (SAST)
#
# Scans Java source for known vulnerability patterns (SQL injection,
# hardcoded credentials, insecure deserialization, etc.) on every PR
# and on a weekly schedule to catch newly-disclosed query patterns
# against existing code.
# ================================================================
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # CodeQL's Java analysis needs a successful build to trace data flow
      - name: Build all services
        run: |
          for svc in user-service product-service order-service inventory-service payment-service notification-service; do
            cd $svc && mvn compile -DskipTests -q && cd ..
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
        # continue-on-error: Code scanning upload requires GitHub Advanced
        # Security (paid for private repos). Remove this line if you enable
        # Advanced Security in Settings → Security and analysis, or make the
        # repo public (code scanning is free for public repos).
        continue-on-error: true
