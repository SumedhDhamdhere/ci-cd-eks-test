# ================================================================
# Kafka — KRaft mode (no ZooKeeper)
# 3 brokers across 3 AZs for HA
# StatefulSet for stable pod names (kafka-0, kafka-1, kafka-2)
# ================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: ecommerce
data:
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-0.kafka:9093"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
  KAFKA_MIN_INSYNC_REPLICAS: "1"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ecommerce
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        ports:
        - containerPort: 9092  # PLAINTEXT clients
        - containerPort: 9093  # CONTROLLER
        envFrom:
        - configMapRef:
            name: kafka-config
        env:
        - name: KAFKA_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://$(POD_NAME).kafka.ecommerce.svc.cluster.local:9092"
        - name: CLUSTER_ID
          value: "MkU3OEVBNTcwNTJENDM2Qk"
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ecommerce
spec:
  selector:
    app: kafka
  ports:
  - name: plaintext
    port: 9092
  - name: controller
    port: 9093
  clusterIP: None  # Headless — each pod gets its own DNS
---
# Job to create topics after Kafka starts
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: ecommerce
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: kafka-init
        image: confluentinc/cp-kafka:7.5.0
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for Kafka..."
          sleep 30
          BS=kafka-0.kafka.ecommerce.svc.cluster.local:9092
          kafka-topics --bootstrap-server $BS --create --if-not-exists --topic order.created      --partitions 12 --replication-factor 1
          kafka-topics --bootstrap-server $BS --create --if-not-exists --topic payment.processed  --partitions 12 --replication-factor 1
          kafka-topics --bootstrap-server $BS --create --if-not-exists --topic inventory.updated  --partitions 6  --replication-factor 1
          kafka-topics --bootstrap-server $BS --create --if-not-exists --topic order.confirmed    --partitions 6  --replication-factor 1
          kafka-topics --bootstrap-server $BS --create --if-not-exists --topic notification.send  --partitions 4  --replication-factor 1
          kafka-topics --bootstrap-server $BS --create --if-not-exists --topic order.cancelled    --partitions 3  --replication-factor 1
          kafka-topics --bootstrap-server $BS --create --if-not-exists --topic product.created    --partitions 4  --replication-factor 1
          echo "✅ All topics created"
          kafka-topics --bootstrap-server $BS --list
