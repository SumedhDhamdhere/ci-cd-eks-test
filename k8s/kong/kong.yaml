# ================================================================
# Kong API Gateway on Kubernetes
# DB-less mode = config in ConfigMap, no extra DB needed
# All external traffic enters here first
# ================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: ecommerce
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: user-service
        url: http://user-service.ecommerce.svc.cluster.local:8081
        routes:
          - name: user-routes
            paths: [/api/users]
            strip_path: false
      - name: product-service
        url: http://product-service.ecommerce.svc.cluster.local:8082
        routes:
          - name: product-routes
            paths: [/api/products]
            strip_path: false
      - name: order-service
        url: http://order-service.ecommerce.svc.cluster.local:8083
        routes:
          - name: order-routes
            paths: [/api/orders]
            strip_path: false
      - name: inventory-service
        url: http://inventory-service.ecommerce.svc.cluster.local:8084
        routes:
          - name: inventory-routes
            paths: [/api/inventory]
            strip_path: false
      - name: payment-service
        url: http://payment-service.ecommerce.svc.cluster.local:8085
        routes:
          - name: payment-routes
            paths: [/api/payments]
            strip_path: false
      # notification-service is deliberately not routed. It has no controller
      # and no HTTP API at all — it is a pure Kafka consumer — so the route only
      # ever returned 404 while advertising the service as public attack surface.
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          limit_by: ip
          # policy: local keeps the counter in each Kong pod's own memory. With
          # kong-hpa scaling to 3 replicas that silently turns a 100/min limit
          # into 300/min, because the same client is counted separately by each
          # gateway pod. A shared Redis counter is the only way the number means
          # what it says once there is more than one Kong replica.
          policy: redis
          redis_host: redis
          redis_port: 6379
          # Resolved at runtime from the REDIS_PASSWORD env var, so the password
          # never lands in this ConfigMap.
          redis_password: "{vault://env/redis-password}"
          redis_timeout: 2000
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid
      - name: prometheus
        config:
          status_code_metrics: true
          latency_metrics: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      containers:
      - name: kong
        image: kong:3.4
        ports:
        - containerPort: 8000  # Proxy (client traffic)
        # 8001 is deliberately NOT declared as a containerPort and is bound to
        # loopback below — see KONG_ADMIN_LISTEN.
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /kong/declarative/kong.yml
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        # The Admin API can create routes, delete routes and disable plugins —
        # it is full control of the gateway, and it has no authentication.
        # It was bound to 0.0.0.0 with a ClusterIP Service in front of it, so
        # any pod in the namespace could reconfigure the gateway. NetworkPolicy
        # blocks that here, but on EKS the VPC CNI does NOT enforce
        # NetworkPolicy unless the policy agent is switched on, so this must not
        # be the only control. Bound to loopback: `kubectl port-forward` still
        # reaches it (port-forward enters the pod's network namespace), which is
        # the only access path an operator actually needs.
        - name: KONG_ADMIN_LISTEN
          value: "127.0.0.1:8001"
        - name: KONG_STATUS_LISTEN
          value: "0.0.0.0:8100"
        # Consumed by the rate-limiting plugin's {vault://env/redis-password}.
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        lifecycle:
          preStop:
            exec:
              command: ["sh","-c","sleep 10"]
        volumeMounts:
        - name: kong-config
          mountPath: /kong/declarative
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /status
            port: 8100
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status
            port: 8100
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: kong-config
        configMap:
          name: kong-config
---
# The ALB's backend. Deliberately ClusterIP, not LoadBalancer.
#
# This used to be `type: LoadBalancer` with
# `service.beta.kubernetes.io/aws-load-balancer-type: "alb"`, which does not do
# what it looks like it does. An ALB is never created from a Service — it comes
# from an Ingress, or from the CLI as scripts/02-alb.sh does here. "alb" is not
# a value the Service annotation recognises, so on EKS this would have quietly
# provisioned a *second*, Classic load balancer next to the ALB the scripts
# already build: another billed resource, another public endpoint, and a
# confusing one to debug because both would answer.
#
# The real path is: 02-alb.sh creates the ALB, target group and listeners, and
# k8s/alb/targetgroupbinding.yaml points the AWS Load Balancer Controller at
# this Service so it keeps the target group's pod IPs in sync. That needs
# nothing more than a ClusterIP here — the controller reads the EndpointSlice,
# not the Service's own load balancer.
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
  - name: proxy
    port: 80
    targetPort: 8000
  - name: proxy-ssl
    port: 443
    targetPort: 8000
---
# The kong-admin Service used to publish the unauthenticated Admin API on
# 8001 to the whole namespace. It is deliberately gone: the API is now bound
# to loopback, so reach it with
#     kubectl -n ecommerce port-forward deploy/kong 8001:8001
# which enters the pod's network namespace and needs no Service.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kong-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kong
  # 2, not 1: Kong is the only ingress path. At one replica any restart,
  # eviction or node drain takes the entire API offline, and a PodDisruptionBudget
  # cannot protect a single replica without deadlocking drains altogether.
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
