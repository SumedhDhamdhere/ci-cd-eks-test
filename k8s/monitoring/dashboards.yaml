            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "custom": {
                  "lineWidth": 2,
                  "fillOpacity": 8,
                  "showPoints": "never"
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            }
          },
          {
            "type": "timeseries",
            "title": "Scrape targets up",
            "description": "Every one of these sat at 0 for the life of this cluster. Grafana looked perfectly healthy the whole time \u2014 it just had nothing to draw.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 12,
              "y": 39,
              "w": 12,
              "h": 8
