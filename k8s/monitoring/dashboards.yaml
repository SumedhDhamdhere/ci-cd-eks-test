                "unit": "short",
                "custom": {
                  "lineWidth": 2,
                  "fillOpacity": 8,
                  "showPoints": "never"
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            }
          }
        ]
      }
