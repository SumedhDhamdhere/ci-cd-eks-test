# ================================================================
# PostgreSQL — DB per service pattern
# Each service has its OWN database = independent deploy + scale
# ================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ecommerce
data:
  POSTGRES_PASSWORD: "postgres123"
---
# USER DB
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-user
  namespace: ecommerce
spec:
  serviceName: postgres-user
  replicas: 1
  selector:
    matchLabels:
      app: postgres-user
  template:
    metadata:
      labels:
        app: postgres-user
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: userdb
        - name: POSTGRES_USER
          value: user_svc
        - name: POSTGRES_PASSWORD
          value: user_pass
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: ecommerce
spec:
  selector:
    app: postgres-user
  ports:
  - port: 5432
  clusterIP: None  # Headless — StatefulSet needs this
---
