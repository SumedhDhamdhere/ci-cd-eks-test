# PRODUCT DB
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-product
  namespace: ecommerce
spec:
  serviceName: postgres-product
  replicas: 1
  selector:
    matchLabels:
      app: postgres-product
  template:
    metadata:
      labels:
        app: postgres-product
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: productdb
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: PRODUCT_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: PRODUCT_DB_PASS
        # Without limits these two could consume whatever the node has left and
        # starve every other pod on it. The other three Postgres StatefulSets
        # already carried this block; these two were missed.
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-product
  namespace: ecommerce
spec:
  selector:
    app: postgres-product
  ports:
  - port: 5432
  clusterIP: None
---
