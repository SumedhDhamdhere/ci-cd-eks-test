# ================================================================
# ConfigMap = non-secret config (DB URLs, Kafka, Redis hosts)
# Secret = sensitive data (passwords, JWT keys)
# ================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka.ecommerce.svc.cluster.local:9092"
  REDIS_HOST: "redis-0.redis.ecommerce.svc.cluster.local"
  REDIS_PORT: "6379"
  AWS_ENDPOINT_URL: "http://floci.ecommerce.svc.cluster.local:4566"
  AWS_DEFAULT_REGION: "ap-south-1"
  SPRING_PROFILE: "prod"
# Secret intentionally NOT stored in source control.
# The CI deploy step creates the app-secrets Secret via kubectl before
# applying these manifests. For local runs use:
#   kubectl apply -f k8s/services/secrets.example.yaml
# See scripts/README.md for the correct secret injection pattern.
