
# ── USER SERVICE ──────────────────────────────────
apiVersion: apps/v1
kind: Deployment # even if this pod dies, the other pod will handle traffic it is not so important so this is deployment not statefulset
metadata:
  name: user-service # this is the name of the deployment
  namespace: ecommerce # this is the namespace where the deployment will be created
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: user-service  #if this does not match with template labels, the deployment will create a new pod with the same template label but then think min replica is one so it will create infinite pods as this line is for managing no of pods in deployment registry
  template: #blueprint for the pod 
    metadata:
      labels:
        app: user-service  #put this label in the pod so that deployment can manage the pod
    spec:
      # Give kube-proxy time to remove this pod from the Service endpoints
      # before the JVM stops accepting. Chaos test showed a 502 + five 5s
      # timeouts on every pod kill without this.
      terminationGracePeriodSeconds: 45
      # None of these services call the Kubernetes API, so they must not carry
      # a token that a compromised container could replay.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: user-service #this is the name of the container 
        image: REGISTRY/ecommerce/user-service:IMAGE_TAG #from where it will pull the image, REGISTRY is the docker registry where the image is stored, IMAGE_TAG is the tag of the image
        ports:
        - containerPort: 8081 #this is the port on which the container will listen for incoming traffic
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp          # the only path the JVM needs to write
          mountPath: /tmp
        lifecycle:
          preStop:
            exec:
              # Endpoint removal is asynchronous. Sleep so in-flight requests
              # drain instead of hitting a socket that is already closing.
              command: ["sh","-c","sleep 10"]
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: USER_DB_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: USER_DB_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: USER_DB_PASS
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecommerce
spec:
  selector:
    app: user-service
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---

