server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-payment}:${DB_PORT:5432}/paymentdb
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    connect-retries: 15
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    admin:
      fail-fast: false
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Defaults were acks=1 with no idempotence, which is why a Kafka broker
      # restart during a load test left 12 of 40 orders stuck at PENDING: the
      # leader acknowledged writes it had not replicated, then lost them during
      # the election. acks=all will not acknowledge until every in-sync replica
      # has the record.
      acks: all
      retries: 10
      properties:
        enable.idempotence: true          # no duplicates when a retry succeeds twice
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Shared with user-service, which mints the tokens this service verifies.
jwt:
  secret: ${JWT_SECRET}
