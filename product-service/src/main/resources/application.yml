server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-product}:${DB_PORT:5432}/productdb
    username: ${DB_USER:product_svc}
    password: ${DB_PASSWORD:product_pass}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_pass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
