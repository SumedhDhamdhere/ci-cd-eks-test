server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-order}:${DB_PORT:5432}/orderdb
    username: ${DB_USER:order_svc}
    password: ${DB_PASSWORD:order_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_pass}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  flyway:
    connect-retries: 15
  kafka:
    admin:
      fail-fast: false
