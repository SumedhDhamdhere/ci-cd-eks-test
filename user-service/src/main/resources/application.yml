server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-user}:${DB_PORT:5432}/userdb
    username: ${DB_USER:user_svc}
    password: ${DB_PASSWORD:user_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_pass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}

jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  flyway:
    connect-retries: 15
